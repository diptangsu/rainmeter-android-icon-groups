[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=25,29,40,250

[Metadata]
Name=Android Launcher Settings
Author=Custom
Version=2.1

[Variables]
Font=Segoe UI
White=245,247,255,255
Muted=175,185,205,255
Blue=83,125,205,255
BtnColor=65,73,92,255

; Total width: 620. Total button span: 190 + 52 + 190 = 432.
; Margin Left/Right: (620 - 432) / 2 = 94.
BtnCol1X=94
BtnCol2X=336
BtnW=190
BtnH=42

; Background fixes the skin's minimum dimensions
[PanelBackground]
Meter=String
X=0
Y=0
W=620
H=480
SolidColor=25,29,40,250

; --- Header Section ---

[Title]
Meter=String
X=#BtnCol1X#
Y=24
W=432
H=28
Text=LAUNCHER SETTINGS
FontFace=#Font#
FontSize=16
FontWeight=700
FontColor=#White#
AntiAlias=1

[Subtitle]
Meter=String
X=#BtnCol1X#
Y=54
W=432
H=20
Text=Create folders and manage your app shortcuts
FontFace=#Font#
FontSize=10
FontColor=#Muted#
AntiAlias=1

; --- Folders Section ---

[FolderHeading]
Meter=String
X=#BtnCol1X#
Y=95
W=432
H=20
Text=FOLDERS
FontFace=#Font#
FontSize=10
FontWeight=700
FontColor=#Muted#
AntiAlias=1

[AddFolder]
Meter=String
X=(#BtnCol1X# + (#BtnW# / 2))
Y=(124 + (#BtnH# / 2))
W=#BtnW#
H=#BtnH#
Text=+  Create folder
FontFace=#Font#
FontSize=10
FontColor=#White#
SolidColor=#Blue#
StringAlign=CenterCenter
ClipString=1
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -WindowStyle Hidden -NoProfile -STA -ExecutionPolicy Bypass -File "#@#Scripts\FolderManager.ps1" -Action AddFolder]

[RenameFolder]
Meter=String
X=(#BtnCol2X# + (#BtnW# / 2))
Y=(124 + (#BtnH# / 2))
W=#BtnW#
H=#BtnH#
Text=Rename folder
FontFace=#Font#
FontSize=10
FontColor=#White#
SolidColor=#BtnColor#
StringAlign=CenterCenter
ClipString=1
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -WindowStyle Hidden -NoProfile -STA -ExecutionPolicy Bypass -File "#@#Scripts\FolderManager.ps1" -Action RenameFolder]

[DeleteFolder]
Meter=String
X=(#BtnCol1X# + (#BtnW# / 2))
Y=(174 + (#BtnH# / 2))
W=#BtnW#
H=#BtnH#
Text=Delete folder
FontFace=#Font#
FontSize=10
FontColor=#White#
SolidColor=#BtnColor#
StringAlign=CenterCenter
ClipString=1
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -WindowStyle Hidden -NoProfile -STA -ExecutionPolicy Bypass -File "#@#Scripts\FolderManager.ps1" -Action DeleteFolder]

[RefreshLauncher]
Meter=String
X=(#BtnCol2X# + (#BtnW# / 2))
Y=(174 + (#BtnH# / 2))
W=#BtnW#
H=#BtnH#
Text=Refresh / Initialize
FontFace=#Font#
FontSize=10
FontColor=#White#
SolidColor=#BtnColor#
StringAlign=CenterCenter
ClipString=1
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -WindowStyle Hidden -NoProfile -STA -ExecutionPolicy Bypass -File "#@#Scripts\FolderManager.ps1" -Action Initialize]

; --- Shortcuts Section ---

[ShortcutHeading]
Meter=String
X=#BtnCol1X#
Y=238
W=432
H=20
Text=SHORTCUTS
FontFace=#Font#
FontSize=10
FontWeight=700
FontColor=#Muted#
AntiAlias=1

[AddShortcut]
Meter=String
X=(#BtnCol1X# + (#BtnW# / 2))
Y=(267 + (#BtnH# / 2))
W=#BtnW#
H=#BtnH#
Text=+  Add shortcut (Browse)
FontFace=#Font#
FontSize=10
FontColor=#White#
SolidColor=#Blue#
StringAlign=CenterCenter
ClipString=1
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -WindowStyle Hidden -NoProfile -STA -ExecutionPolicy Bypass -File "#@#Scripts\FolderManager.ps1" -Action AddShortcut]

[RemoveShortcut]
Meter=String
X=(#BtnCol2X# + (#BtnW# / 2))
Y=(267 + (#BtnH# / 2))
W=#BtnW#
H=#BtnH#
Text=Remove shortcut
FontFace=#Font#
FontSize=10
FontColor=#White#
SolidColor=#BtnColor#
StringAlign=CenterCenter
ClipString=1
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -WindowStyle Hidden -NoProfile -STA -ExecutionPolicy Bypass -File "#@#Scripts\FolderManager.ps1" -Action RemoveShortcut]

[CustomIcon]
Meter=String
X=(#BtnCol1X# + (#BtnW# / 2))
Y=(317 + (#BtnH# / 2))
W=#BtnW#
H=#BtnH#
Text=Change shortcut icon
FontFace=#Font#
FontSize=10
FontColor=#White#
SolidColor=#BtnColor#
StringAlign=CenterCenter
ClipString=1
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=["C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -WindowStyle Hidden -NoProfile -STA -ExecutionPolicy Bypass -File "#@#Scripts\FolderManager.ps1" -Action SetCustomIcon]

; --- Footer / Help Text ---

[Help1]
Meter=String
X=#BtnCol1X#
Y=382
W=432
H=18
Text=Changes are saved automatically.
FontFace=#Font#
FontSize=9
FontColor=#Muted#
AntiAlias=1

[Help2]
Meter=String
X=#BtnCol1X#
Y=404
W=432
H=18
Text=Your original files and shortcuts are never deleted.
FontFace=#Font#
FontSize=9
FontColor=#Muted#
AntiAlias=1
